<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מונית משותפת · גב-ים רעננה</title>
  <meta name="description" content="הקילומטר האחרון: תיאום מוניות משותפות בין תחנות הרכבת (רעננה דרום / הרצליה) לגב-ים רעננה. אנונימי, בלי הרשמה.">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="header">
    <div class="wrap header-inner">
      <h1>🚕 מונית משותפת · גב-ים רעננה</h1>
      <p class="tagline">סוגרים את <b>הקילומטר האחרון</b> — בין תחנת הרכבת למרכז העבודה.<br>
      מרכבת רעננה דרום או רכבת הרצליה ועד גב-ים רעננה, ובחזרה. אנונימי לגמרי, בלי הרשמה.</p>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <div class="chips" id="filters" role="tablist" aria-label="סינון לפי תחנה">
        <button class="chip active" data-filter="all">הכל</button>
        <button class="chip" data-filter="raanana">🚆 רעננה דרום</button>
        <button class="chip" data-filter="herzliya">🚆 הרצליה</button>
      </div>
      <div class="toolbar-actions">
        <button id="refresh" class="btn ghost" title="רענון">⟳</button>
        <button id="newPost" class="btn primary">+ מחפשים מונית</button>
      </div>
    </div>

    <div id="list" class="list" aria-live="polite"></div>
  </main>

  <footer class="wrap footer">
    סוגרים את הקילומטר האחרון בין הרכבת לעבודה 🚕 — בלי חשבונות, בלי טלפונים, בלי מידע אישי.
  </footer>

  <dialog id="postDialog" class="dialog">
    <form id="postForm" method="dialog" novalidate>
      <h2>מחפשים מונית? 🚕</h2>

      <div class="field">
        <label>כיוון הנסיעה</label>
        <div class="segmented" id="directionSeg">
          <button type="button" class="seg active" data-direction="toG">→ לגב-ים רעננה</button>
          <button type="button" class="seg" data-direction="fromG">מגב-ים רעננה →</button>
        </div>
      </div>

      <div class="field">
        <label>מאיזו תחנת רכבת?</label>
        <div class="segmented" id="stationSeg">
          <button type="button" class="seg active" data-station="רכבת רעננה דרום (כוכב יעקב)" title="רכבת רעננה דרום (כוכב יעקב)">רעננה דרום</button>
          <button type="button" class="seg" data-station="רכבת הרצליה" title="רכבת הרצליה">הרצליה</button>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="date">תאריך</label>
          <input id="date" type="date" required>
        </div>
        <div class="field">
          <label for="time">שעת יציאה</label>
          <input id="time" type="time" required>
        </div>
      </div>

      <div class="field">
        <label for="flexible">גמישות בשעה</label>
        <select id="flexible">
          <option value="">מדויק</option>
          <option value="±15 דקות">±15 דקות</option>
          <option value="±30 דקות">±30 דקות</option>
          <option value="גמיש, נתאים לפי השאר">גמיש, נתאים לפי השאר</option>
        </select>
      </div>

      <div class="field">
        <label for="note">הערה קצרה <span class="hint">(למשל: "ממש על הדרך", "2 מקומות", "חוזר ב-17:00")</span></label>
        <input id="note" maxlength="300" placeholder="אופציונלי">
      </div>

      <p id="formError" class="error" hidden></p>

      <div class="actions">
        <button type="button" class="btn ghost" data-close>ביטול</button>
        <button type="submit" class="btn primary">פרסום חיפוש</button>
      </div>
    </form>
  </dialog>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-head">
        <span class="dir-badge"></span>
        <span class="name"></span>
      </div>
      <div class="route"></div>
      <div class="when"></div>
      <p class="note" hidden></p>
      <div class="comments"></div>
      <div class="quick"></div>
      <form class="comment-form">
        <input class="comment-input" maxlength="300" placeholder="כתבו לי... (אנונימי)" required>
        <button type="submit" class="btn primary sm">שלח</button>
      </form>
      <button class="btn danger-link del" hidden>מחיקת הפרסום</button>
    </article>
  </template>

  <script src="/app.js"></script>
</body>
</html>
